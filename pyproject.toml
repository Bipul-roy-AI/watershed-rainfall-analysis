[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watershed-rainfall-analyzer"
version = "3.0.0"
description = "A Streamlit-based tool for zonal rainfall analysis over watershed boundaries using raster and vector geospatial data."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Bipul Roy"},
]
dependencies = [
    "streamlit>=1.32.0,<2.0",
    "geopandas>=0.14.3,<1.0",
    "pandas>=2.2.0,<3.0",
    "rasterio>=1.3.9,<2.0",
    "rasterstats>=0.19.0,<0.20",
    "numpy>=1.26.4,<3.0",
    "matplotlib>=3.8.3,<4.0",
    "plotly>=5.18.0,<6.0",
    "folium>=0.16.0,<1.0",
    "scipy>=1.12.0,<2.0",
    "xarray>=2024.1.0",
    "rioxarray>=0.15.0",
    "netcdf4>=1.6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.2",
    "black>=24.0",
    "pre-commit>=3.6",
]
netcdf = [
    "netcdf4>=1.6.5",
    "zarr>=2.17",
]

[tool.setuptools]
packages = [
    "watershed_analyzer",
    "watershed_analyzer.core",
    "watershed_analyzer.ui",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
